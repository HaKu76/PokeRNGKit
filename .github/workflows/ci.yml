name: Verify And Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Install npm dependencies
        run: npm ci --engine-strict

      - name: Verify TypeScript application
        run: npm run verify

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.6

      - name: Cache Emscripten compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.emscripten_cache
          key: ${{ runner.os }}-emscripten-6.0.6-${{ hashFiles('wasm/**', 'scripts/wasm.mjs') }}
          restore-keys: |
            ${{ runner.os }}-emscripten-6.0.6-

      - name: Verify Wasm toolchain
        run: npm run wasm:doctor

      - name: Verify native Core parity
        run: npm run wasm:test:native

      - name: Build Wasm and web application
        run: npm run build
        env:
          BASE_PATH: ./

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload production dist artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error

  windows-portable:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download production dist
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Build portable Windows package
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "PokeRNGKit-portable"
          $archive = Join-Path $env:RUNNER_TEMP "PokeRNGKit.7z"
          $exe = Join-Path $env:GITHUB_WORKSPACE "PokeRNGKit.exe"
          $zip = Join-Path $env:GITHUB_WORKSPACE "PokeRNGKit-windows-portable.zip"
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          $sfx = Join-Path $env:ProgramFiles "7-Zip\7z.sfx"

          if (-not $sevenZip -or -not (Test-Path -LiteralPath $sfx)) {
            throw "7-Zip and its 7z.sfx module are required on the Windows runner."
          }

          Remove-Item -LiteralPath $staging, $archive, $exe, $zip -Force -Recurse -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "dist\*") -Destination $staging -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "scripts\windows-launcher.ps1") -Destination (Join-Path $staging "launch.ps1") -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "scripts\windows-sfx-config.txt") -Destination (Join-Path $env:RUNNER_TEMP "sfx-config.txt") -Force

          & $sevenZip a -t7z -mx=9 $archive "$staging\*"
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip archive creation failed with exit code $LASTEXITCODE."
          }

          $output = [IO.File]::Open($exe, [IO.FileMode]::Create, [IO.FileAccess]::Write)
          try {
            foreach ($part in @($sfx, (Join-Path $env:RUNNER_TEMP "sfx-config.txt"), $archive)) {
              $bytes = [IO.File]::ReadAllBytes($part)
              $output.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $output.Dispose()
          }

          Compress-Archive -Path "$staging\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item -LiteralPath $exe, $zip | Format-Table Name, Length

      - name: Upload Windows portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            PokeRNGKit.exe
            PokeRNGKit-windows-portable.zip
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_PROJECT_NAME != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main
